<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        dark: '#0f172a'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-slate-200 min-h-screen font-sans selection:bg-primary selection:text-white">
    <div class="max-w-6xl mx-auto px-4 py-12">
        
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-5xl font-extrabold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent inline-block mb-4">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>AI Image Studio
            </h1>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto">
                Paste any public image URL below. Our high-performance libvips microservice will process, resize, and apply professional filters instantly.
            </p>
        </header>

        <!-- Main Workspace -->
        <main class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Controls Panel -->
            <div class="lg:col-span-4 bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 backdrop-blur-xl shadow-2xl h-fit">
                <h2 class="text-xl font-bold text-white mb-6 flex items-center">
                    <i class="fa-solid fa-sliders mr-3 text-primary"></i> Control Panel
                </h2>

                <div class="space-y-5">
                    <!-- Image URL -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Image URL</label>
                        <input type="text" id="imageUrl" value="https://images.unsplash.com/photo-1517694712202-14dd9538aa97" 
                            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                            placeholder="https://example.com/image.jpg">
                    </div>

                    <!-- Filter Selection -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Filter Type</label>
                        <select id="filterType" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-primary transition-all appearance-none cursor-pointer">
                            <option value="grayscale">Noir (Grayscale)</option>
                            <option value="sepia">Vintage (Sepia)</option>
                            <option value="blur">Cinematic (Blur)</option>
                            <option value="invert">Cyberpunk (Invert)</option>
                            <option value="none">Original (None)</option>
                        </select>
                    </div>

                    <!-- Dimensions -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Width (px)</label>
                            <input type="number" id="imgWidth" value="600" min="50" max="2000"
                                class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-primary transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Height (px)</label>
                            <input type="number" id="imgHeight" value="400" min="50" max="2000"
                                class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-primary transition-all">
                        </div>
                    </div>

                    <!-- Generate Button -->
                    <button onclick="generateImage()" id="genBtn" class="w-full mt-4 bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-500 hover:to-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg transform transition hover:-translate-y-1 hover:shadow-primary/30 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-bolt"></i> Process Image
                    </button>
                </div>
            </div>

            <!-- Preview Panel -->
            <div class="lg:col-span-8 bg-slate-900 rounded-2xl border border-slate-800 shadow-inner flex flex-col overflow-hidden min-h-[500px]">
                
                <div class="bg-slate-800/80 border-b border-slate-700/50 px-6 py-4 flex justify-between items-center">
                    <h3 class="text-white font-semibold flex items-center">
                        <i class="fa-solid fa-eye mr-2 text-emerald-400"></i> Live Preview
                    </h3>
                    <div class="flex gap-2">
                        <div class="w-3 h-3 rounded-full bg-red-500"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    </div>
                </div>

                <div class="flex-1 relative flex justify-center items-center p-8 bg-[url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAMUlEQVQ4T2NkYNgNwMjAyMjAwPzPQEzw6OBoYBg1gGE0DBqGkWE0DBqGwRA0gOEEWQBoRwQ1w2w27QAAAABJRU5ErkJggg==')]">
                    
                    <!-- Loading Spinner -->
                    <div id="loader" class="hidden absolute inset-0 bg-slate-900/80 backdrop-blur flex justify-center items-center z-10">
                        <div class="inline-block w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
                    </div>

                    <!-- Error Alert -->
                    <div id="errorAlert" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-red-500/10 border border-red-500/50 text-red-400 px-6 py-3 rounded-lg backdrop-blur-md shadow-2xl flex items-center gap-3 z-20">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span id="errorMsg">Failed to process image.</span>
                    </div>

                    <!-- Result Image -->
                    <img id="resultImage" src="" alt="Processed Result" class="hidden max-w-full max-h-full rounded-lg shadow-2xl transition-opacity duration-500">
                    
                    <!-- Placeholder -->
                    <div id="placeholder" class="text-slate-600 text-center">
                        <i class="fa-regular fa-image text-6xl mb-4 opacity-50"></i>
                        <p>Your processed masterpiece will appear here</p>
                    </div>
                </div>
                
                <!-- Action Bar -->
                <div class="bg-slate-800/80 border-t border-slate-700/50 px-6 py-4 flex justify-end">
                    <a id="downloadBtn" href="#" download="processed_image.jpg" class="hidden bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded-lg font-medium transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-download"></i> Download HQ
                    </a>
                </div>
            </div>

        </main>
    </div>

    <script>
        async function generateImage() {
            const url = document.getElementById('imageUrl').value;
            const filter = document.getElementById('filterType').value;
            const w = document.getElementById('imgWidth').value;
            const h = document.getElementById('imgHeight').value;
            
            const loader = document.getElementById('loader');
            const placeholder = document.getElementById('placeholder');
            const resultImg = document.getElementById('resultImage');
            const errorAlert = document.getElementById('errorAlert');
            const downloadBtn = document.getElementById('downloadBtn');
            const genBtn = document.getElementById('genBtn');

            if (!url) return;

            // Reset UI
            errorAlert.classList.add('hidden');
            resultImg.classList.add('hidden');
            placeholder.classList.add('hidden');
            loader.classList.remove('hidden');
            genBtn.disabled = true;
            genBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            downloadBtn.classList.add('hidden');

            const apiUrl = `/filteredimage?image_url=${encodeURIComponent(url)}&filter=${filter}&width=${w}&height=${h}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.message || 'Unable to process image. Check URL.');
                }
                
                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);
                
                resultImg.src = objectUrl;
                resultImg.onload = () => {
                    loader.classList.add('hidden');
                    resultImg.classList.remove('hidden');
                    downloadBtn.href = objectUrl;
                    downloadBtn.classList.remove('hidden');
                };

            } catch (err) {
                loader.classList.add('hidden');
                placeholder.classList.remove('hidden');
                document.getElementById('errorMsg').innerText = err.message;
                errorAlert.classList.remove('hidden');
            } finally {
                genBtn.disabled = false;
                genBtn.innerHTML = '<i class="fa-solid fa-bolt"></i> Process Image';
            }
        }
        
        // Auto-run on load
        window.onload = generateImage;
    </script>
</body>
</html>
